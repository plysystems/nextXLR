<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>NEXT : XLR — Fader A–D Mute</title>
    <link rel="stylesheet" href="pi.css" />
</head>
<body>
    <div class="sdpi-wrapper">
        <div class="badge">NEXT : XLR HARDWARE-FADER</div>

        <div class="sdpi-item">
            <div class="sdpi-item-label">Fader:</div>
            <div class="sdpi-item-value">
                <select id="fader">
                    <option value="A">Hardware Fader A</option>
                    <option value="B">Hardware Fader B</option>
                    <option value="C">Hardware Fader C</option>
                    <option value="D">Hardware Fader D</option>
                </select>
            </div>
        </div>

        <div class="sdpi-item">
            <div class="sdpi-item-label">Verhalten:</div>
            <div class="sdpi-item-value">
                <select id="mode">
                    <option value="toggle">Umschalten (Toggle)</option>
                    <option value="mute">Nur Stummschalten</option>
                    <option value="unmute">Nur Entstummen</option>
                </select>
            </div>
        </div>

        <div class="sdpi-item">
            <div class="sdpi-item-label">Info:</div>
            <div class="sdpi-item-value" style="font-size: 11px; color: #8B93A3; padding: 4px 0;">
                Stummschalten des aktuell dem physischen Fader A, B, C oder D zugewiesenen Audiokanals.
            </div>
        </div>
    </div>

    <script src="pi.js"></script>
    <script>
        function initUI() {
            document.getElementById("fader").value = settings.fader || "A";
            document.getElementById("mode").value = settings.mode || "toggle";

            document.getElementById("fader").onchange = onChange;
            document.getElementById("mode").onchange = onChange;
        }

        function onChange() {
            settings.fader = document.getElementById("fader").value;
            settings.mode = document.getElementById("mode").value;
            saveSettings();
        }
    </script>
</body>
</html>
