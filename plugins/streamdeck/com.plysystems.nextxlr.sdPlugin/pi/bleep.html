<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>NEXT : XLR — Zensur / Bleep</title>
    <link rel="stylesheet" href="pi.css" />
</head>
<body>
    <div class="sdpi-wrapper">
        <div class="badge">NEXT : XLR AUDIO ENGINE</div>

        <div class="sdpi-item">
            <div class="sdpi-item-label">Modus:</div>
            <div class="sdpi-item-value">
                <select id="mode">
                    <option value="hold">Gedrückt halten (Push-to-Bleep)</option>
                    <option value="toggle">Umschalten (Toggle)</option>
                </select>
                <div class="hint">Spielt den GoXLR Piepton ab und mutet das Mikrofon solange aktiv.</div>
            </div>
        </div>
    </div>

    <script src="pi.js"></script>
    <script>
        function initUI() {
            document.getElementById("mode").value = settings.mode || "hold";
            document.getElementById("mode").onchange = onChange;
        }

        function onChange() {
            settings.mode = document.getElementById("mode").value;
            saveSettings();
        }
    </script>
</body>
</html>
