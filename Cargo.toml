[workspace]
resolver = "2"
members = ["crates/protocol", "crates/engine", "crates/usb", "crates/daemon"]

[workspace.package]
version = "0.1.0-alpha"
edition = "2021"
authors = ["plysystems"]
license = "plysystems"

[workspace.dependencies]
mixforge-protocol = { path = "crates/protocol" }
mixforge-engine = { path = "crates/engine" }
mixforge-usb = { path = "crates/usb" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
cpal = "0.15"
rtrb = "0.3"
nusb = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
